[project]
name = "civicllm-backend"
version = "0.1.0"
description = "Grounded, private RAG engine for institutional corpora (cities, universities, hospitals)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "psycopg[binary,pool]>=3.2",
    "pgvector>=0.3",
    "anthropic>=0.40",
    "pyyaml>=6.0",
    "beautifulsoup4>=4.12",
    "lxml>=5.2",
]

[dependency-groups]
dev = ["pyright>=1.1", "ruff>=0.6", "pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.pyright]
include = ["app", "ingest", "eval", "tests"]
typeCheckingMode = "basic"

[tool.ruff]
line-length = 100
