services:
  db:
    image: pgvector/pgvector:pg16
    container_name: civicllm-db
    environment:
      POSTGRES_USER: civicllm
      POSTGRES_PASSWORD: civicllm-dev
      POSTGRES_DB: civicllm
    ports:
      - "5433:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U civicllm"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  db_data:
